apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minecraft-hosting-ingress
  namespace: minecraft-hosting
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # DDoS Protection
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # WebSocket Support
    nginx.ingress.kubernetes.io/websocket-services: "backend"
spec:
  tls:
  - hosts:
    - minecraft-hosting.example.com
    secretName: minecraft-hosting-tls
  rules:
  - host: minecraft-hosting.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3000
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
